<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | FIA'O</title>
  <meta name="description" content="Crea tu cuenta de FIA'O.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Style/styles.css">
</head>
<body data-page="simple">

  <header class="header" id="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">FIA'O</a>
      <nav class="nav" id="nav" aria-label="Principal">
        <a href="index.html">Inicio</a>
        <a href="fiados.html">Fiados</a>
        <a href="clientes.html">Clientes</a>
        <a href="productos.html">Productos</a>
        <a href="reportes.html">Reportes</a>
        <a href="contacto.html">Contacto</a>
        <div class="nav__actions">
          <a href="login.html" class="btn btn--ghost">Iniciar sesión</a>
          <a href="registro.html" class="btn btn--primary">Crear cuenta</a>
        </div>
      </nav>
      <button class="burger" id="burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
    </div>
  </header>

  <main>
    <section class="auth">
      <div class="auth__box panel-box">
        <h1 class="h3">Crear cuenta</h1>
        <form class="form form--light" id="form" data-auth="registro" novalidate>
          <label for="name">Nombre</label><input id="name" name="name" type="text" autocomplete="name"><small class="error" data-for="name"></small>
          <label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="email"><small class="error" data-for="email"></small>
          <label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="new-password"><small class="error" data-for="password"></small>
          <label for="confirm">Repite la contraseña</label><input id="confirm" name="confirm" type="password" autocomplete="new-password"><small class="error" data-for="confirm"></small>
          <button class="btn btn--primary btn--lg" type="submit">Crear cuenta</button>
          <p class="form__ok" role="status" hidden>Cuenta creada. Entrando a tu panel...</p>
        </form>
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="logo">FIA'O</p>
      <p>© 2026 FIA'O. Hecho para los negocios de Panamá.</p>
      <nav aria-label="Legal"><a href="#">Privacidad</a><a href="#">Términos</a><a href="#">Accesibilidad</a></nav>
    </div>
  </footer>

  <script src="../Javas/script.js"></script>
</body>
</html>
