<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Productos | Panel FIA'O</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../Style/styles.css">
  <link rel="stylesheet" href="../../Style/app.css">
</head>
<body class="app" data-page="productos">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="logo">FIA'O</a>
      <nav class="side-nav" id="sideNav" aria-label="Panel"></nav>
      <div class="side-foot">
        <p id="userName"></p>
        <button class="btn btn--ghost btn--sm" id="logout" type="button">Cerrar sesión</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="app-main">
      <header class="topbar">
        <button class="burger" id="menuBtn" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar"><span></span><span></span></button>
        <h1>Productos</h1>
        <span class="topbar__biz" id="bizName"></span>
        <button class="btn btn--primary btn--sm" id="newMov" type="button">+ Nuevo movimiento</button>
      </header>

      <main class="app-content">
        <section class="panel-box">
          <div class="panel-head">
            <input class="search" id="productSearch" type="search" placeholder="Buscar producto" aria-label="Buscar producto">
            <button class="btn btn--primary btn--sm" id="addProduct" type="button">+ Agregar producto</button>
          </div>
        </section>
        <div class="cards" id="productGrid"></div>
      </main>
    </div>
  </div>
  <script src="../../Javas/app.js"></script>
</body>
</html>
